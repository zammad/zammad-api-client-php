name: Release assets

# Attaches the Symfony Flex recipe endpoint to every published release, so that
# applications can use releases/latest/download/index.json as a recipe source
# (#182). Run it by hand to attach the files to a release that lacks them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Flex endpoint to"
        required: true

permissions:
  contents: write

jobs:
  flex-endpoint:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      # The recipe files must be served from `latest`, not from this tag: the
      # index is fetched through releases/latest/download, and Flex resolves
      # the recipe URL from the index it got.
      - run: php bin/build-flex-endpoint.php build/flex "https://github.com/${{ github.repository }}/releases/latest/download"
      - run: gh release upload "$TAG" build/flex/*.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
